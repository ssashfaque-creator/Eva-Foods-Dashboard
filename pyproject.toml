[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eva-dashboard"
version = "1.4.12"
description = "Eva Foods dashboard app for sales/cost/client Excel uploads and PDF reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "streamlit>=1.28",
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
preview = ["pypdfium2>=4.0", "Pillow>=10.0"]
bridge = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
eva-dashboard = "eva_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eva_dashboard*"]

[tool.setuptools.package-data]
eva_dashboard = [
  "data_catalog.md",
  "metrics_catalog.json",
  "client_type_groups.json",
  "golden_queries.json",
  "golden_magic_eval.json",
]
