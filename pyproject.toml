[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eva-dashboard"
version = "0.4.23"
description = "Eva Foods dashboard app for sales/cost/client Excel uploads and PDF reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "streamlit>=1.28",
  "openai>=1.40",
]

[project.optional-dependencies]
preview = ["pypdfium2>=4.0", "Pillow>=10.0"]

[project.scripts]
eva-dashboard = "eva_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eva_dashboard*"]

[tool.setuptools.package-data]
eva_dashboard = ["data_catalog.md"]
